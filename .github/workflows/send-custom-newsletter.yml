name: Send Custom Newsletter

# Manual one-off issue. Reads custom_newsletter_subject.txt + custom_newsletter_email.html
# and POSTs them to the sendNewsletter Cloud Function. That function NEVER emails
# subscribers: it creates a custom issue awaiting approval and emails the admin a review
# copy. Subscribers get it only after the admin approves it on /admin/.
# Dispatch-only — never runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      test_to:
        description: 'Type "yes" for a [TEST] copy to the admin only. Leave empty to create an issue for approval on /admin/.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Create issue for approval (or send admin test copy)
        env:
          TEST_TO_INPUT: ${{ github.event.inputs.test_to }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
        run: |
          set -euo pipefail
          if [ ! -f custom_newsletter_email.html ] || [ ! -f custom_newsletter_subject.txt ]; then
            echo "Missing subject or body file — aborting."; exit 1
          fi
          SUBJECT=$(cat custom_newsletter_subject.txt)
          TEST_TO="${TEST_TO_INPUT}"
          jq -n --arg s "$SUBJECT" --arg t "$TEST_TO" --rawfile b custom_newsletter_email.html \
            '{subject:$s, body:$b} + (if $t != "" then {testTo:$t} else {} end)' > payload.json
          if [ -n "$TEST_TO" ]; then echo "TEST MODE — a [TEST] copy goes to the admin only"; fi
          RESP=$(curl -sS -w $'\n%{http_code}' -X POST \
            "https://us-central1-karthik-website-b5801.cloudfunctions.net/sendNewsletter" \
            -H "Content-Type: application/json" \
            -H "X-Newsletter-Secret: ${NEWSLETTER_SECRET}" \
            --data @payload.json)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "Response: $BODY"
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "Send failed."; exit 1; }
