name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'functions-chat/**'
      - 'functions-python/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # firebase deploy loads the functions source to analyze it — deps must exist.
      # (package-lock.json is gitignored, so npm install rather than npm ci.)
      - name: Install function dependencies
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix functions-chat --no-audit --no-fund

      # Python codebase (reviseIssue). firebase deploy analyses it from functions-python/venv.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python function dependencies
        run: |
          python -m venv functions-python/venv
          functions-python/venv/bin/pip install -q -r functions-python/requirements.txt

      # askKarthik needs GEMINI_API_KEY in Firebase Secret Manager.
      # Value comes from the same GH secret the newsletter pipeline uses;
      # sets a fresh secret version on each functions deploy (rare).
      - name: Ensure GEMINI_API_KEY secret
        run: |
          printf '%s' "${{ secrets.GEMINI_API_KEY }}" | npx -y firebase-tools@13 functions:secrets:set GEMINI_API_KEY \
            --project karthik-website-b5801 --data-file=-
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Deploys ALL codebases: default (newsletter: GMAIL_USER, GMAIL_PASSWORD,
      # NEWSLETTER_SECRET), chat (askKarthik: GEMINI_API_KEY) and revise
      # (reviseIssue: GEMINI_API_KEY, NEWSLETTER_SECRET). Runs the CLI on the runner (not in a container) so it can use the venv above.
      - name: Deploy functions
        run: npx -y firebase-tools@15.37.0 deploy --only functions --project karthik-website-b5801 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
