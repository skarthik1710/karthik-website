name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # firebase deploy loads the functions source to analyze it — deps must exist.
      # (package-lock.json is gitignored, so npm install rather than npm ci.)
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      # askKarthik needs GEMINI_API_KEY in Firebase Secret Manager.
      # Value comes from the same GH secret the newsletter pipeline uses;
      # sets a fresh secret version on each functions deploy (rare).
      - name: Ensure GEMINI_API_KEY secret
        run: |
          printf '%s' "${{ secrets.GEMINI_API_KEY }}" | npx -y firebase-tools@13 functions:secrets:set GEMINI_API_KEY \
            --project karthik-website-b5801 --data-file=-
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # NOTE: scoped to askKarthik because sendNewsletter's secrets
      # (GMAIL_USER, GMAIL_PASSWORD, NEWSLETTER_SECRET) are absent from
      # Secret Manager — a full "--only functions" deploy fails on them.
      # Owner must run `firebase functions:secrets:set` for those three
      # before sendNewsletter can be redeployed.
      - name: Deploy functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions:askKarthik
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
