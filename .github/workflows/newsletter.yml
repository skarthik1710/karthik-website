name: Weekly Newsletter Draft + Review

# Drafts the weekly issue, has two independent search-grounded Gemini reviewers
# check every claim, saves everything as pending_review, and emails the admin a
# review digest. It NEVER publishes to the site or emails subscribers — that only
# happens when the admin approves the issue on /admin/ (approveIssue function).
#
# 10:00 UTC Friday = 5am EST / 6am EDT, so the review email is in the inbox
# before 7am ET even with GitHub's scheduling delays.
on:
  schedule:
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's issue if it already exists (only while it is still awaiting approval)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newsletter-draft
  cancel-in-progress: false

jobs:
  draft-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai firebase-admin requests beautifulsoup4

      - name: Draft, review, and email the admin
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          NEWSLETTER_FORCE: ${{ github.event.inputs.force }}
          # Optional overrides (repo Settings → Variables) if a model is retired.
          NEWSLETTER_WRITER_MODEL: ${{ vars.NEWSLETTER_WRITER_MODEL || 'models/gemini-2.5-flash' }}
          NEWSLETTER_FACTCHECK_MODEL: ${{ vars.NEWSLETTER_FACTCHECK_MODEL || 'models/gemini-2.5-pro' }}
          NEWSLETTER_EDITOR_MODEL: ${{ vars.NEWSLETTER_EDITOR_MODEL || 'models/gemini-2.5-flash' }}
        run: python scripts/generate_newsletter.py
