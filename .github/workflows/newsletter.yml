name: Daily Newsletter Update


on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:
    inputs:
      review_mode:
        description: 'Save articles as drafts for review (true) instead of auto-publishing (false)'
        type: boolean
        default: true


permissions:
  contents: write


jobs:
  update-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3


      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install google-genai firebase-admin requests beautifulsoup4


      - name: Generate newsletter articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEWSLETTER_REVIEW_MODE: ${{ github.event.inputs.review_mode }}
        run: python scripts/generate_newsletter.py


      - name: Commit updated newsletter.html
        run: |
          git config --global user.email "newsletter-bot@karthikeyanselvam.com"
          git config --global user.name "Newsletter Bot"
          git add public/newsletter.html
          git commit -m "🗞️ Auto newsletter update - $(date +'%Y-%m-%d')" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/skarthik1710/karthik-website.git main


      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}


      - name: Send Newsletter to Subscribers
        if: github.event_name == 'schedule'
        run: |
          if [ ! -f newsletter_email.html ]; then
            echo "No email body was generated (no articles?) — skipping send."
            exit 0
          fi
          SUBJECT=$(cat newsletter_subject.txt 2>/dev/null || echo "AI Insights — $(date +'%B %d, %Y')")
          jq -n --arg s "$SUBJECT" --rawfile b newsletter_email.html '{subject:$s, body:$b}' > payload.json
          curl -X POST "https://us-central1-karthik-website-b5801.cloudfunctions.net/sendNewsletter" \
            -H "Content-Type: application/json" \
            --data @payload.json
